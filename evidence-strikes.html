<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DefendAble — Evidence · Industrial action</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1A1A2E;--ink2:#2D2D44;--ink3:#6B6B80;--rule:#D8D8E0;--rule2:#EBEBF0;--surface:#FFFFFF;--surface2:#F7F7F9;--surface3:#EFEFF2;--accent:#1B3A6B;--accent2:#254E91;--accent-faint:#EEF2F8;--confirm:#1A5C3A;--confirm-faint:#EEF7F2;--caution:#7A4E00;--caution-faint:#FDF4E3;--alert:#8B1A1A;--alert-faint:#FBF0F0;--navy:var(--ink);--blue:var(--accent2);--blue-faint:var(--accent-faint);--green:var(--confirm);--amber:var(--caution);--red:var(--alert);--border:var(--rule);--text:var(--ink);--text2:var(--ink2);--text3:var(--ink3);--font:'Helvetica Neue','Arial',sans-serif;--font-serif:'Georgia','Times New Roman',serif;--mono:'Courier New','Courier',monospace;--r:3px}
html,body{height:100%;font-family:var(--font);background:var(--surface2);color:var(--text);font-size:14px;overflow:hidden}
.global-nav{background:var(--navy);height:48px;display:flex;align-items:center;padding:0 20px;flex-shrink:0}
.gn-logo{display:flex;align-items:center;gap:8px;text-decoration:none;margin-right:20px}
.gn-mark{width:28px;height:28px;background:var(--blue);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.gn-name{font-size:14px;font-weight:500;color:#fff}
.gn-links{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden}
.gn-link{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r);font-size:12px;font-weight:500;color:rgba(255,255,255,0.5);text-decoration:none;transition:all 0.15s;white-space:nowrap}
.gn-link:hover{background:rgba(255,255,255,0.08);color:#fff}
.gn-link.active{background:rgba(42,111,219,0.35);color:#fff}
.gn-right{display:flex;align-items:center;gap:8px;margin-left:8px}
.gn-user-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:3px 10px 3px 4px;cursor:pointer}
.gn-av{width:24px;height:24px;border-radius:50%;background:#1C2E44;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500}
.gn-user{font-size:11px;font-weight:500;color:rgba(255,255,255,0.85)}
.page-hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;flex-shrink:0}
.crumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);margin-bottom:6px}
.crumb a{color:var(--text3);text-decoration:none}
.crumb a:hover{color:var(--blue)}
.crumb i{font-size:12px}
.hdr-flex{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.page-title{font-family:var(--font-serif);font-size:24px;font-weight:400;color:var(--text);letter-spacing:-0.01em}
.page-sub{font-size:12px;color:var(--text3);margin-top:3px}
.hdr-meta{display:flex;gap:16px;font-size:11px;color:var(--text3)}
.hdr-meta strong{color:var(--text);font-family:var(--mono);font-weight:600}
.category-ribbon{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:2px;overflow-x:auto;flex-shrink:0}
.ribbon-tab{display:flex;align-items:center;gap:6px;padding:11px 14px;font-size:12px;font-weight:500;color:var(--text3);text-decoration:none;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.ribbon-tab:hover{color:var(--text2);background:var(--surface2)}
.ribbon-tab.active{color:var(--text);border-bottom-color:var(--blue);background:var(--surface2)}
.ribbon-tab i{font-size:14px;color:var(--text3)}
.ribbon-tab.active i{color:var(--blue)}
.workspace{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 48px - 60px - 41px);min-height:0}
.sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:16px 0}
.sb-section{padding:0 18px 14px}
.sb-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px}
.sb-input{width:100%;font-family:var(--font);font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--text)}
.sb-input:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.sb-btn-group{display:flex;flex-wrap:wrap;gap:4px}
.sb-btn{font-size:11px;padding:4px 9px;border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:var(--r);cursor:pointer;font-family:var(--font)}
.sb-btn:hover{background:var(--surface2)}
.sb-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.sb-count{padding:10px 18px 6px;background:var(--surface2);border-top:1px solid var(--rule2);font-size:11px;color:var(--text3)}
.sb-count strong{color:var(--text);font-family:var(--mono);font-weight:600}
.main{overflow-y:auto;padding:22px 26px;background:var(--surface2)}
.strike-column{max-width:820px}
.strike-source-hdr{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.strike-source-hdr:first-child{margin-top:0}
.strike-flag{width:28px;height:20px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.flag-fr{background:linear-gradient(to right, #0055A4 33%, #fff 33%, #fff 66%, #EF4135 66%)}
.flag-it{background:linear-gradient(to right, #009246 33%, #fff 33%, #fff 66%, #CE2B37 66%)}
.strike-source-name{font-family:var(--font-serif);font-size:16px;font-weight:400;color:var(--text)}
.strike-source-meta{font-size:11px;color:var(--text3);margin-left:auto;font-family:var(--mono)}
.strike-list{display:flex;flex-direction:column;gap:8px}
.strike-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:var(--r);padding:12px 16px;display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:flex-start}
.strike-date{font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:600;padding-top:2px}
.strike-body{min-width:0}
.strike-snippet{font-size:12px;color:var(--text2);line-height:1.5;word-break:break-word}
.strike-empty{padding:60px;text-align:center;color:var(--text3);font-size:12px}
.strike-empty i{display:block;font-size:30px;color:var(--rule);margin-bottom:12px}
.loading{padding:60px;text-align:center;color:var(--text3);font-size:12px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--rule);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="global-nav">
  <a href="index.html" class="gn-logo"><div class="gn-mark"><i class="ti ti-lock"></i></div><span class="gn-name">DefendAble</span></a>
  <div class="gn-links" id="gn-links"></div>
  <div class="gn-right">
    <div class="gn-user-btn" id="gn-user-btn"><div class="gn-av" id="gn-av">SB</div><span class="gn-user" id="gn-username">S. Booth</span></div>
    <div id="user-dropdown" class="user-dropdown"></div>
  </div>
</nav>

<div class="page-hdr">
  <div class="crumb"><a href="evidence.html">Evidence</a><i class="ti ti-chevron-right"></i><span>Industrial action</span></div>
  <div class="hdr-flex">
    <div>
      <div class="page-title">Industrial action</div>
      <div class="page-sub">French DGAC + Italian ENAC strike notices — third-party industrial-action evidence for extraordinary-circumstances defence.</div>
    </div>
    <div class="hdr-meta" id="hdr-meta">
      <div><strong id="m-france">—</strong> France notices</div>
      <div><strong id="m-italy">—</strong> Italy notices</div>
      <div>Pulled <strong id="m-pulled">—</strong></div>
    </div>
  </div>
</div>

<div class="category-ribbon" id="category-ribbon"></div>

<div class="workspace">
  <aside class="sidebar">
    <div class="sb-section">
      <div class="sb-title">Search</div>
      <input class="sb-input" id="search" placeholder="Date, keyword…">
    </div>
    <div class="sb-section">
      <div class="sb-title">Country</div>
      <div class="sb-btn-group" id="country-filters"></div>
    </div>
    <div class="sb-count" id="sb-count"></div>
  </aside>
  <main class="main">
    <div id="strike-body" class="strike-column"><div class="loading"><span class="spinner"></span>Loading strike notices from evidence-collection…</div></div>
  </main>
</div>

<script src="shared_data.js"></script>
<script src="shared_theme.js"></script>
<script src="defendable_evidence_reader.js?v=s9a"></script>
<script src="nav.js"></script>

<script>
(function(){
  var CATEGORIES = [
    { id:'weather',  label:'Weather',           icon:'ti-cloud-storm',  page:'evidence-weather.html' },
    { id:'notams',   label:'NOTAMs',            icon:'ti-file-text',    page:'evidence-notams.html' },
    { id:'news',     label:'News',              icon:'ti-news',         page:'evidence-news.html' },
    { id:'flights',  label:'Flight tracks',     icon:'ti-plane',        page:'evidence-flights.html' },
    { id:'global',   label:'Natural disaster',  icon:'ti-flame',        page:'evidence-global.html' },
    { id:'strikes',  label:'Industrial action', icon:'ti-hand-stop',    page:'evidence-strikes.html' },
    { id:'atfm',     label:'ATFM',              icon:'ti-traffic-cone', page:'evidence-atfm.html' },
    { id:'ash',      label:'Volcanic ash',      icon:'ti-mountain',     page:'evidence-ash.html' },
  ];
  document.getElementById('category-ribbon').innerHTML = CATEGORIES.map(function(c){
    return '<a href="'+c.page+'" class="ribbon-tab'+(c.id==='strikes'?' active':'')+'"><i class="ti '+c.icon+'"></i>'+c.label+'</a>';
  }).join('');

  var state = { search:'', country:'all', fr:[], it:[] };
  function chipRow(items, active, id, onChange){
    var el = document.getElementById(id);
    el.innerHTML = items.map(function(i){ return '<button class="sb-btn'+(i.id===active?' active':'')+'" data-k="'+i.id+'">'+i.label+'</button>'; }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.sb-btn'), function(b){ b.onclick = function(){ onChange(b.dataset.k); }; });
  }

  function esc(s){ return String(s||'').replace(/[<>]/g,''); }

  function renderSection(label, cls, notices){
    var s = state.search.toLowerCase();
    var list = notices.filter(function(n){ if (!s) return true; return ((n.date_match||'') + ' ' + (n.snippet||'')).toLowerCase().indexOf(s) >= 0; });
    if (!list.length) return '';
    var items = list.map(function(n){
      return '<div class="strike-item">'+
        '<div class="strike-date">'+esc(n.date_match || '—')+'</div>'+
        '<div class="strike-body"><div class="strike-snippet">'+esc(n.snippet)+'</div></div>'+
      '</div>';
    }).join('');
    return '<div class="strike-source-hdr"><div class="strike-flag '+cls+'"></div><div class="strike-source-name">'+label+'</div><div class="strike-source-meta">'+list.length+' notices</div></div>'+
      '<div class="strike-list">'+items+'</div>';
  }

  function render(){
    var showFr = state.country === 'all' || state.country === 'FR';
    var showIt = state.country === 'all' || state.country === 'IT';
    var html = '';
    if (showFr) html += renderSection('France · DGAC', 'flag-fr', state.fr);
    if (showIt) html += renderSection('Italy · ENAC',  'flag-it', state.it);
    if (!html) html = '<div class="strike-empty"><i class="ti ti-hand-stop"></i>No strike notices in the latest snapshot match this filter.</div>';
    document.getElementById('strike-body').innerHTML = html;
    var shown = 0;
    if (showFr) shown += state.fr.length;
    if (showIt) shown += state.it.length;
    document.getElementById('sb-count').innerHTML = '<div class="sb-title">Filter summary</div><div>Shown: <strong>'+shown+'</strong> of '+(state.fr.length+state.it.length)+'</div>';
  }

  chipRow([{id:'all',label:'All'},{id:'FR',label:'France'},{id:'IT',label:'Italy'}], state.country, 'country-filters', function(k){ state.country = k; render(); chipRow([{id:'all',label:'All'},{id:'FR',label:'France'},{id:'IT',label:'Italy'}], k, 'country-filters', arguments.callee); });
  document.getElementById('search').oninput = function(e){ state.search = e.target.value.trim(); render(); };

  Promise.all([
    window.EvidenceCollection.get('dgac-france-notices'),
    window.EvidenceCollection.get('enac-italy-notices'),
  ]).then(function(r){
    var fr = r[0], it = r[1];
    state.fr = (fr && fr.data && fr.data.notices) || [];
    state.it = (it && it.data && it.data.notices) || [];
    document.getElementById('m-france').textContent = state.fr.length;
    document.getElementById('m-italy').textContent = state.it.length;
    var fresh = (fr && fr.pulled_at) || (it && it.pulled_at);
    document.getElementById('m-pulled').textContent = fresh ? new Date(fresh).toISOString().slice(0,16).replace('T',' ')+'Z' : '—';
    render();
  }).catch(function(){
    document.getElementById('strike-body').innerHTML = '<div class="strike-empty"><i class="ti ti-cloud-off"></i>Could not reach the evidence-collection repository.</div>';
  });
})();
</script>
</body>
</html>
